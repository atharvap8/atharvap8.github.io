<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Atharva Phadke</title>
    <link rel="icon" type="image/png" href="../../assets/main/logo.png">
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="../../projects.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&family=Orbitron:wght@600;800&family=Outfit:wght@300;400;500;600;700;800&family=Space+Mono&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Navigation Header -->
    <header class="header">
        <div class="header-container">
            <nav class="nav-menu">
                <a href="../../index.html" class="nav-btn">Home</a>
                <a href="../../index.html#about" class="nav-btn">About</a>
                <a href="../projects/index.html" class="nav-btn">Projects</a>
                <a href="#" class="nav-btn active">Blog</a>
                <a href="../../index.html#resume" class="nav-btn">Resume</a>
                <a href="../../index.html#contact" class="nav-btn">Contact</a>
            </nav>
            <button class="menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main class="main-content">
        <section class="section">
            <div class="container">
                <h2 class="section-title">Articles & Practicals</h2>
                <div class="blog-grid" id="blogGrid">
                    <!-- Blog cards will be injected here via JavaScript -->
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2025 Atharva. Built with passion for embedded systems and IoT.</p>
            <div class="footer-links">
                <a href="https://github.com/atharvap8">GitHub</a>
                <a href="https://linkedin.com">LinkedIn</a>
                <a href="mailto:atharva@example.com">Email</a>
            </div>
        </div>
    </footer>

    <script src="../../blogs-data.js"></script>
    <script src="../../script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const blogGrid = document.getElementById('blogGrid');
            if (!blogGrid || typeof blogsData === 'undefined') return;

            Object.keys(blogsData).forEach(blogId => {
                const blog = blogsData[blogId];
                const card = document.createElement('article');
                card.className = 'blog-card';
                card.innerHTML = `
                    <div class="blog-date">${blog.date || ''}</div>
                    <h3><a href="view.html?id=${blogId}">${blog.title}</a></h3>
                    <p>${blog.summary}</p>
                    <div class="blog-footer">
                        <span class="read-time">Read</span>
                        <a href="view.html?id=${blogId}" class="read-more">Read More →</a>
                    </div>
                `;
                blogGrid.appendChild(card);
            });
        });
    </script>

</body>

</html>
