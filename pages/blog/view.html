<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title will be updated by JS -->
    <title>Blog Reader</title>
    <link rel="icon" type="image/png" href="../../assets/main/logo.png">
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="../../projects.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;850&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <nav class="nav-menu">
                <a href="../../index.html" class="nav-btn">Home</a>
                <a href="../../index.html#about" class="nav-btn">About</a>
                <a href="../projects/index.html" class="nav-btn">Projects</a>
                <a href="index.html" class="nav-btn active">Blog</a>
                <a href="../../index.html#resume" class="nav-btn">Resume</a>
                <a href="../../index.html#contact" class="nav-btn">Contact</a>
            </nav>
            <button class="menu-toggle" aria-label="Toggle Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main class="main-content">
        <div class="article-container">
            <!-- Breadcrumb Navigation -->
            <div class="back-link-container">
                <a href="index.html" class="btn-back">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7" />
                    </svg>
                    Back to Blogs
                </a>
            </div>

            <!-- Hero Section -->
            <section class="parallax-hero" id="projectHero">
                <div class="parallax-bg" id="heroBanner">
                </div>
                <div class="parallax-overlay"></div>

                <div class="parallax-content">
                    <h1 class="article-title" id="pageTitle">Loading...</h1>
                    <p class="article-date" id="pageDate"></p>
                </div>
            </section>

            <div id="projectSummaryWrapper">
                <p class="article-summary" id="projectSummary" style="margin-bottom: var(--space-48);"></p>
            </div>


            <div class="article-grid">
                <!-- Table of Contents Sidebar -->
                <aside class="article-sidebar">
                    <div class="sidebar-project-title" id="sidebarTitle">...</div>
                    <div class="toc-title">On This Page</div>
                    <ul class="toc-list" id="tocList">
                        <!-- TOC injected here -->
                    </ul>
                </aside>

                <!-- Main Content -->
                <article class="article-content" id="mainContent">
                    <!-- Content sections will be injected here -->
                </article>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2025 Atharva Phadke. All rights reserved.</p>
            <div class="footer-links">
                <a href="https://github.com/atharvap8">GitHub</a>
                <a href="https://linkedin.com/in/atharvap8">LinkedIn</a>
                <a href="mailto:atharvaphadke8@gmail.com">Email</a>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <!-- Load the data file first -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="../../blogs-data.js"></script>
    <script src="../../script.js"></script>
    <script src="../../parallax.js"></script>

    <!-- Page Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Get Blog ID
            const urlParams = new URLSearchParams(window.location.search);
            const blogId = urlParams.get('id');

            // 2. Find Data
            if (typeof blogsData === 'undefined' || !blogId || !blogsData[blogId]) {
                window.location.replace('../../404.html');
                return;
            }

            const data = blogsData[blogId];

            // 3. Populate Hero & Metadata
            document.title = `${data.title} :: Atharva Phadke`;
            document.getElementById('pageTitle').innerText = data.title;
            if (data.date) {
                document.getElementById('pageDate').innerText = data.date;
            }
            document.getElementById('projectSummary').innerText = data.summary;
            document.getElementById('sidebarTitle').innerText = data.title;

            // Set Banner Image
            const heroBanner = document.getElementById('heroBanner');
            if (data.banner) {
                heroBanner.style.backgroundImage = `url('${data.banner}')`;
            } else {
                // Default style or class if no banner
                heroBanner.style.background = `linear-gradient(45deg, #1a1a1a, #2a2a2a)`;
            }

            // 4. Populate Content & TOC
            const contentContainer = document.getElementById('mainContent');
            const tocList = document.getElementById('tocList');

            // Clear existing (if any)
            contentContainer.innerHTML = 'Loading content...';
            tocList.innerHTML = '';

            if (data.contentUrl) {
                fetch(data.contentUrl)
                    .then(response => {
                        if (!response.ok) throw new Error("Failed to load content");
                        return response.text();
                    })
                    .then(markdown => {
                        // Custom renderer: convert ![alt](video.mp4) to <video> tags
                        const renderer = new marked.Renderer();
                        const defaultImageRenderer = renderer.image.bind(renderer);
                        renderer.image = function({ href, title, text }) {
                            const videoExts = ['.mp4', '.mov', '.webm', '.mkv', '.avi'];
                            const ext = href ? href.substring(href.lastIndexOf('.')).toLowerCase().split('?')[0] : '';
                            if (videoExts.includes(ext)) {
                                const titleAttr = title ? ` title="${title}"` : '';
                                return `<video src="${href}" controls autoplay loop muted playsinline${titleAttr} alt="${text || ''}">Your browser does not support the video tag.</video>`;
                            }
                            return defaultImageRenderer({ href, title, text });
                        };

                        contentContainer.innerHTML = marked.parse(markdown, { renderer });

                        // Generate TOC from H2 headers
                        const headers = contentContainer.querySelectorAll('h2');
                        headers.forEach((header, index) => {
                            // Assign id if missing
                            if (!header.id) {
                                header.id = 'section-' + index;
                            }

                            const li = document.createElement('li');
                            const a = document.createElement('a');
                            a.href = '#' + header.id;
                            a.className = 'toc-link';
                            a.innerText = header.innerText.replace(/^[^\w\s]*\s*/, '');
                            if (index === 0) a.classList.add('active');

                            li.appendChild(a);
                            tocList.appendChild(li);
                        });

                        if (typeof window.initTOCScrollSpy === 'function') {
                            setTimeout(() => {
                                window.initTOCScrollSpy();
                                window.initLightbox();
                            }, 100);
                        }
                    })
                    .catch(err => {
                        console.error(err);
                        contentContainer.innerHTML = "<p>Error loading blog content.</p>";
                    });
            }
        });
    </script>
</body>

</html>
