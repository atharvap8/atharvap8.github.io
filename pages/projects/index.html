<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Atharva Phadke</title>
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="../../projects.css">
</head>

<body>
    <!-- Navigation Header -->
    <header class="header">
        <div class="header-container">
            <nav class="nav-menu">
                <a href="../../index.html" class="nav-btn">Home</a>
                <a href="../../index.html#about" class="nav-btn">About</a>
                <a href="#" class="nav-btn active">Projects</a>
                <a href="../blog/index.html" class="nav-btn">Blog</a>
                <a href="../../index.html#resume" class="nav-btn">Resume</a>
                <a href="../../index.html#contact" class="nav-btn">Contact</a>
            </nav>
            <button class="menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main class="main-content">
        <section class="section">
            <div class="container">
                <h2 class="section-title">My Projects</h2>
                <div class="projects-grid" id="projectsGrid">
                    <!-- Cards injected via JS -->
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2025 Atharva. Built with passion for embedded systems and IoT.</p>
            <div class="footer-links">
                <a href="https://github.com/atharvap8">GitHub</a>
                <a href="https://linkedin.com">LinkedIn</a>
                <a href="mailto:atharva@example.com">Email</a>
            </div>
        </div>
    </footer>

    <script src="../../projects-data.js"></script>
    <script src="../../script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const projectsGrid = document.getElementById('projectsGrid');
            if (!projectsGrid || typeof projectsData === 'undefined') return;

            Object.keys(projectsData).forEach(id => {
                const project = projectsData[id];
                const cardLink = document.createElement('a');
                cardLink.href = `view.html?id=${id}`;
                cardLink.className = 'project-card-link';

                let thumbSrc = project.banner || project.thumbnail || '../../assets/placeholder.jpg';
                // If banner is used as thumbnail, ensure it fits well
                // For now, simple img tag

                cardLink.innerHTML = `
                    <article class="project-card">
                        <div class="project-image">
                            <img src="${thumbSrc}" alt="${project.title}" class="project-thumb">
                        </div>
                        <div class="project-info">
                            <h3>${project.title}</h3>
                            <p>${project.summary}</p>
                            <span class="project-link">View Project →</span>
                        </div>
                    </article>
                `;
                projectsGrid.appendChild(cardLink);
            });
        });
    </script>

</body>

</html>
