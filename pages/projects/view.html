<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title will be updated by JS -->
    <title>Project Viewer</title>
    <link rel="icon" type="image/png" href="../../assets/main/logo.png">
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="../../projects.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&family=Orbitron:wght@600;800&family=Outfit:wght@300;400;500;600;700;800&family=Space+Mono&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Navigation Header -->
    <header class="header">
        <div class="header-container">
            <nav class="nav-menu">
                <a href="../../index.html" class="nav-btn">Home</a>
                <a href="../../index.html#about" class="nav-btn">About</a>
                <a href="index.html" class="nav-btn active">Projects</a>
                <a href="../blog/index.html" class="nav-btn">Blog</a>
                <a href="../../index.html#resume" class="nav-btn">Resume</a>
                <a href="../../index.html#contact" class="nav-btn">Contact</a>
            </nav>
            <button class="menu-toggle" aria-label="Toggle Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main class="main-content">
        <div class="article-container">
            <!-- Breadcrumb Navigation -->
            <div class="back-link-container">
                <a href="index.html" class="btn-back">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7" />
                    </svg>
                    Back to Projects
                </a>
            </div>

            <!-- Hero Section -->
            <section class="parallax-hero" id="projectHero">
                <div class="parallax-bg" id="heroBanner">
                </div>
                <div class="parallax-overlay"></div>

                <div class="parallax-content">
                    <h1 class="article-title" id="pageTitle">Loading...</h1>
                    <p class="article-tagline" id="projectSummary"></p>
                </div>
            </section>


            <div class="article-grid">
                <!-- Table of Contents Sidebar -->
                <aside class="article-sidebar">
                    <div class="sidebar-project-title" id="sidebarTitle">...</div>
                    <div class="toc-title">On This Page</div>
                    <ul class="toc-list" id="tocList">
                        <!-- TOC Items will be injected here -->
                    </ul>
                </aside>

                <!-- Main Content -->
                <article class="article-content" id="mainContent">
                    <!-- Content sections will be injected here -->
                </article>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2025 Atharva. Built with passion for embedded systems and IoT.</p>
            <div class="footer-links">
                <a href="https://github.com/atharvap8">GitHub</a>
                <a href="https://linkedin.com">LinkedIn</a>
                <a href="mailto:atharva@example.com">Email</a>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <!-- Load the data file first -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="../../projects-data.js"></script>
    <script src="../../script.js"></script>
    <script src="../../parallax.js"></script>

    <!-- Page Specific Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Get Project ID from URL (e.g., view.html?id=advanced-iot-washing-machine)
            const urlParams = new URLSearchParams(window.location.search);
            const projectId = urlParams.get('id');

            // 2. Find Data
            if (typeof projectsData === 'undefined' || !projectId || !projectsData[projectId]) {
                window.location.replace('../../404.html');
                return;
            }

            const data = projectsData[projectId];

            // 3. Populate Hero & Metadata
            document.title = `${data.title} :: Atharva Phadke`;
            document.getElementById('pageTitle').innerText = data.title;
            document.getElementById('projectSummary').innerText = data.summary;
            document.getElementById('sidebarTitle').innerText = data.title;

            // Set Banner Image
            const heroBanner = document.getElementById('heroBanner');
            if (data.banner) {
                heroBanner.style.backgroundImage = `url('${data.banner}')`;
            }

            // 4. Populate Content & TOC
            const contentContainer = document.getElementById('mainContent');
            const tocList = document.getElementById('tocList');

            // Clear existing (if any)
            contentContainer.innerHTML = 'Loading content...';
            tocList.innerHTML = '';

            if (data.contentUrl) {
                fetch(data.contentUrl)
                    .then(response => {
                        if (!response.ok) throw new Error("Failed to load content");
                        return response.text();
                    })
                    .then(markdown => {
                        const rawHtml = marked.parse(markdown);
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = rawHtml;

                        contentContainer.innerHTML = '';
                        tocList.innerHTML = '';

                        let currentSection = null;
                        let sectionIndex = 0;

                        // Helper to finalize a section
                        const appendSection = () => {
                            if (currentSection) {
                                contentContainer.appendChild(currentSection);
                            }
                        };

                        Array.from(tempDiv.children).forEach(child => {
                            // If we hit an H2, start a new semantic section
                            if (child.tagName === 'H2') {
                                appendSection();
                                currentSection = document.createElement('section');

                                // Create specific ID from text (friendly url) or fallback
                                const text = child.innerText.trim();
                                const id = text
                                    .toLowerCase()
                                    .replace(/[^\w\s-]/g, '') // remove icons/special chars
                                    .replace(/\s+/g, '-');

                                currentSection.id = id || `section-${sectionIndex++}`;
                                currentSection.appendChild(child);
                            } else {
                                // Ensure we have a section to append to (e.g. intro)
                                if (!currentSection) {
                                    currentSection = document.createElement('section');
                                    currentSection.id = 'introduction';
                                }

                                // Special handling for Images: Transform <p><img></p> to <figure><img><caption/></figure>
                                if (child.tagName === 'P' && child.querySelector('img')) {
                                    const img = child.querySelector('img');
                                    // Check if P contains only the image (and whitespace)
                                    if (child.innerText.trim() === '') {
                                        const figure = document.createElement('figure');
                                        figure.className = 'article-figure';

                                        img.className = 'article-img'; // Add class for specific styling if needed
                                        figure.appendChild(img);

                                        if (img.alt) {
                                            const caption = document.createElement('figcaption');
                                            caption.className = 'article-caption';
                                            caption.innerText = img.alt;
                                            figure.appendChild(caption);
                                        }

                                        // Use the figure instead of the P
                                        currentSection.appendChild(figure);
                                    } else {
                                        // Image inline with text, just append P
                                        currentSection.appendChild(child);
                                    }
                                } else {
                                    currentSection.appendChild(child);
                                }
                            }
                        });
                        appendSection();

                        // Generate TOC from the created Sections
                        const sections = contentContainer.querySelectorAll('section');
                        sections.forEach((section, index) => {
                            const header = section.querySelector('h2');
                            if (!header) return; // Skip intro if it has no header

                            const li = document.createElement('li');
                            const a = document.createElement('a');
                            a.href = '#' + section.id;
                            a.className = 'toc-link';
                            // Remove emoji/icons from TOC text for cleaner look
                            a.innerText = header.innerText.replace(/^[^\w\s]+\s*/, '');

                            if (index === 0) a.classList.add('active');
                            li.appendChild(a);
                            tocList.appendChild(li);
                        });

                        // Re-initialize dynamic features
                        if (typeof window.initTOCScrollSpy === 'function') {
                            setTimeout(() => {
                                window.initTOCScrollSpy();
                                window.initLightbox();
                            }, 100);
                        }
                    })
                    .catch(err => {
                        console.error(err);
                        contentContainer.innerHTML = "<p>Error loading project content.</p>";
                    });
            } else if (data.sections) {
                // Fallback for legacy format if any
                data.sections.forEach((section, index) => {
                    const sectionEl = document.createElement('section');
                    sectionEl.id = section.id;
                    sectionEl.innerHTML = `
                        <h2>${section.heading}</h2>
                        ${marked.parse(section.content)}
                    `;
                    contentContainer.appendChild(sectionEl);

                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = `#${section.id}`;
                    a.className = 'toc-link';
                    if (index === 0) a.classList.add('active');
                    a.innerText = section.heading.replace(/^[^\w\s]*\s*/, '');
                    li.appendChild(a);
                    tocList.appendChild(li);
                });
            }

            // Manually re-attach Lightbox listeners since standard script run before content injection
            // A simple way is to dispatch an event or just copy the lightbox logic here if it's not exposed.
            // For this output, we'll assume the basic content renders fine. 
        });
    </script>
</body>

</html>
